<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VSafe Guardian — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="login-shell">
  <div class="card login-card">
    <div class="logo" style="margin-bottom: 24px">
      <div class="logo-mark"><img src="logo.jpeg" alt="VSafe" /></div>
      <div>
        <h1 style="font-size:20px">VSafe Guardian</h1>
        <div class="subtitle">Live monitoring console</div>
      </div>
    </div>
    <h1>Sign in</h1>
    <p class="subtitle">Enter your guardian credentials to monitor alerts.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn" class="btn" style="width:100%; padding:14px">Sign in</button>
    <p id="error" style="color: var(--primary); margin-top: 14px; font-size:13px"></p>
  </div>
</div>
<script type="module" src="auth.js"></script>
</body>
</html>
